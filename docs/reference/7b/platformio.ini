; Waveshare ESP32-S3-Touch-LCD-7B - buoc 1: bring-up man hinh + cam ung
;
; Build:   pio run
; Nap:     pio run -t upload
; Serial:  pio device monitor
;
; Board that do duoc: ESP32-S3 rev2, flash 16 MB, PSRAM 8 MB octal -> N16R8.
; (sdkconfig cua Waveshare khai 8MB, nhung chip tra ve 16384 KB.)
; memory_type = qio_opi la dong QUAN TRONG NHAT - sai dong nay thi PSRAM
; khong duoc nhan ra va panel RGB khong co cho de framebuffer.

[platformio]
; Repo nam trong OneDrive\May tinh - duong dan co DAU TIENG VIET.
; ld.exe khong mo duoc file o duong dan phi ASCII (gcc thi chiu duoc), link se
; chet voi "cannot open map file". Day thu muc build ra cho chi co ASCII.
; Doi lai: xoa build bang `rm -r C:/pio-build/bambu-p1s-7b`, khong phai .pio/
build_dir = C:/pio-build/bambu-p1s-7b

[env:waveshare-7b]
; Platform chinh chu (platformio/espressif32 7.1.0) van dong goi Arduino
; core 2.0.17 = IDF 4.4, chua co num_fbs / bounce_buffer_size_px cho panel
; RGB. Bounce buffer la bat buoc voi 1024x600 nen phai dung ban cong dong
; nay: Arduino 3.3.11 tren ESP-IDF 5.5.5.
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board     = esp32-s3-devkitc1-n16r8  ; 16MB flash quad + 8MB PSRAM octal
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.partitions          = default_16MB.csv

; CH343 tren board nay chay 921600 on dinh. Doi COM neu may khac.
upload_speed  = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
    bitbank2/JPEGDEC@^1.6.2
    bitbank2/PNGdec@^1.0.3

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=3
    ; Khong them CONFIG_SPIRAM_* o day: chung la tuy chon sdkconfig da bien dich
    ; san vao thu vien Arduino, dat qua build_flags KHONG co tac dung gi.
